services:
  web:
    build:
      target: production
    environment:
      NODE_ENV: production
    volumes: !reset []

  backoffice:
    build:
      target: production
      args:
        INVENTORY_API_URL: http://services:8000/api/v1/inventory
    environment:
      NODE_ENV: production
    volumes: !reset []

  services:
    command: ["uvicorn", "services.main:app", "--host", "0.0.0.0", "--port", "8000"]
