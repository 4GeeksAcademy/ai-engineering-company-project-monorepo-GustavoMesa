version: "3.8"

services:
  # 1. Sitio web público
  web:
    build:
      context: ./uis/website
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./uis/website:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      - PORT=3000
      - NODE_ENV=development
    networks:
      - brasaland-net
    depends_on:
      - services

  # 2. Panel de administración (backoffice)
  backoffice:
    build:
      context: ./uis/backoffice
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    volumes:
      - ./uis/backoffice:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      - PORT=3001
      - NODE_ENV=development
      - INVENTORY_API_URL=http://services:8000/api/v1/inventory
    networks:
      - brasaland-net
    depends_on:
      - services

  # 3. Backend API (FastAPI)
  services:
    build:
      context: .
      dockerfile: services/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./services:/app/services
      - ./src:/app/src
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - PORT=8000
    networks:
      - brasaland-net

# Red interna para comunicación entre servicios por nombre de contenedor
networks:
  brasaland-net:
    driver: bridge