version: "3.8"

services:
  # 1. Sitio web público
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      - PORT=3000
      - NODE_ENV=development
    networks:
      - brasaland-net
    depends_on:
      - services

  # 2. Panel de administración (backoffice)
  backoffice:
    build:
      context: ./backoffice
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    volumes:
      - ./backoffice:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      - PORT=3001
      - NODE_ENV=development
    networks:
      - brasaland-net
    depends_on:
      - services

  # 3. Backend API (FastAPI)
  services:
    build:
      context: ./services
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./services:/app
    env_file:
      - .env
    environment:
      - PORT=8000
    networks:
      - brasaland-net

# Red interna para comunicación entre servicios por nombre de contenedor
networks:
  brasaland-net:
    driver: bridge